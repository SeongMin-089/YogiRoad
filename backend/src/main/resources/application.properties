spring.application.name=yogiroad-backend
kakao.rest-api-key=${KAKAO_REST_API_KEY:}
kakao.client-secret=${KAKAO_CLIENT_SECRET:}
kakao.redirect-uri=${KAKAO_REDIRECT_URI:}
yogiroad.jwt.secret=${YOGIROAD_JWT_SECRET:}
yogiroad.jwt.expiration=PT168H
yogiroad.auth.session-ttl=PT5M
server.forward-headers-strategy=framework
restaurant-license.api-key=${RESTAURANT_LICENSE_API_KEY:}
restaurant-license.base-url=https://apis.data.go.kr/1741000/general_restaurants/info
restaurant-license.cache-ttl=PT15M
yogiroad.notifications.poll-interval-ms=${YOGIROAD_NOTIFICATIONS_POLL_INTERVAL_MS:600000}
yogiroad.notifications.initial-delay-ms=${YOGIROAD_NOTIFICATIONS_INITIAL_DELAY_MS:30000}
yogiroad.notifications.max-regions-per-run=${YOGIROAD_NOTIFICATIONS_MAX_REGIONS_PER_RUN:50}
yogiroad.notifications.lock-ttl=${YOGIROAD_NOTIFICATIONS_LOCK_TTL:PT15M}
public-store.api-key=${PUBLIC_STORE_API_KEY:${EXPO_PUBLIC_PUBLIC_DATA_KEY:}}
public-store.base-url=https://apis.data.go.kr/B553077/api/open/sdsc2/storeListInRadius
public-store.cache-ttl=PT2M
